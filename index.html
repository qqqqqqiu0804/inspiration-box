<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵感盒子 · Inspiration Box</title>
<style>
  :root {
    --bg: #f6f7fb;
    --card: #ffffff;
    --ink: #1f2430;
    --muted: #8a93a6;
    --line: #e8ebf2;
    --brand: #6c63ff;
    --brand-soft: #efedff;
    --danger: #ef5a6f;
    --ok: #2bb673;
    --shadow: 0 6px 22px rgba(31,36,48,.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
  }
  .wrap { max-width: 920px; margin: 0 auto; padding: 24px 18px 80px; }
  header.top { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  header.top h1 { font-size: 22px; margin: 0; letter-spacing: .5px; }
  header.top .dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 4px var(--brand-soft); }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  .panel {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
    margin-bottom: 22px;
  }
  label.fld { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 6px; }
  label.fld:first-child { margin-top: 0; }
  input[type=text], textarea {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    color: var(--ink);
    background: #fbfbfe;
    transition: border-color .15s, box-shadow .15s;
  }
  input[type=text]:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
    background: #fff;
  }
  textarea { min-height: 96px; resize: vertical; }

  .filezone {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .filezone:hover { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .filezone input { display: none; }
  .thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .thumbs .t { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
  .thumbs .t img { width: 100%; height: 100%; object-fit: cover; }
  .thumbs .t .x { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.55); color: #fff; border: none; border-radius: 50%; width: 18px; height: 18px; font-size: 12px; line-height: 1; cursor: pointer; }

  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 14px;
    font-family: inherit;
    cursor: pointer;
    transition: transform .08s, opacity .15s;
  }
  button:active { transform: translateY(1px); }
  .btn-primary { background: var(--brand); color: #fff; font-weight: 600; }
  .btn-primary:hover { opacity: .92; }
  .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .btn-ghost:hover { color: var(--ink); border-color: var(--muted); }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid #f6d3d9; }
  .btn-danger:hover { background: #fdeef0; }

  .toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .toolbar input[type=text] { flex: 1; min-width: 200px; }
  .count { color: var(--muted); font-size: 13px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; }
  .card h3 { margin: 0 0 6px; font-size: 15px; word-break: break-word; }
  .card .meta { color: var(--muted); font-size: 12px; margin-bottom: 8px; }
  .card .body { font-size: 14px; white-space: pre-wrap; word-break: break-word; color: #363c4a; flex: 1; }
  .card .imgs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .card .imgs img { width: 100%; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; }
  .card .acts { margin-top: 12px; display: flex; justify-content: flex-end; }

  .empty { text-align: center; color: var(--muted); padding: 50px 10px; }
  .empty .big { font-size: 40px; margin-bottom: 8px; }

  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px; }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 92%; max-height: 92%; border-radius: 10px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f2430; color: #fff; padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  footer.note { text-align: center; color: var(--muted); font-size: 12px; margin-top: 30px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="dot"></span>
    <h1>灵感盒子</h1>
  </header>
  <p class="sub">标题 + 内容 + 可选图片，随手记，存在你浏览器里。换设备/清缓存数据不带走，记得定期导出备份。</p>

  <div class="panel">
    <label class="fld">标题</label>
    <input type="text" id="title" placeholder="一句话灵感，比如：黄婷婷快节奏混剪" />

    <label class="fld">具体内容</label>
    <textarea id="content" placeholder="想做啥、方向、素材、备注……随便写"></textarea>

    <label class="fld">图片（可选，可多选）</label>
    <label class="filezone" id="filezone">
      点击选择图片，或直接把图拖到这里
      <input type="file" id="file" accept="image/*" multiple />
    </label>
    <div class="thumbs" id="thumbs"></div>

    <div class="row">
      <button class="btn-primary" id="save">保存到灵感盒子</button>
      <button class="btn-ghost" id="clear">清空表单</button>
    </div>
  </div>

  <div class="toolbar">
    <input type="text" id="search" placeholder="搜索标题或内容…" />
    <span class="count" id="count"></span>
    <button class="btn-ghost" id="export">导出备份</button>
    <button class="btn-ghost" id="import">导入备份</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" />
  </div>

  <div class="grid" id="grid"></div>
  <div class="empty" id="empty">
    <div class="big">💡</div>
    <div>还没有灵感。上面写一条，点「保存」试试。</div>
  </div>

  <footer class="note">数据保存在本机浏览器（IndexedDB）· 纯静态站 · GitHub Pages 托管</footer>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt="" /></div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";
  var DB_NAME = "inspirationBox", STORE = "items";
  var dbp = null;
  function openDB() {
    if (dbp) return dbp;
    dbp = new Promise(function (resolve, reject) {
      var req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = function () {
        var db = req.result;
        if (!db.objectStoreNames.contains(STORE)) {
          db.createObjectStore(STORE, { keyPath: "id" });
        }
      };
      req.onsuccess = function () { resolve(req.result); };
      req.onerror = function () { reject(req.error); };
    });
    return dbp;
  }
  function tx(mode) { return openDB().then(function (db) { return db.transaction(STORE, mode).objectStore(STORE); }); }
  function put(item) { return tx("readwrite").then(function (s) { return new Promise(function (res, rej) { var r = s.put(item); r.onsuccess = function(){res();}; r.onerror = function(){rej(r.error);}; }); }); }
  function del(id) { return tx("readwrite").then(function (s) { return new Promise(function (res, rej) { var r = s.delete(id); r.onsuccess = function(){res();}; r.onerror = function(){rej(r.error);}; }); }); }
  function all() { return tx("readonly").then(function (s) { return new Promise(function (res, rej) { var r = s.getAll(); r.onsuccess = function(){res(r.result || []);}; r.onerror = function(){rej(r.error);}; }); }); }

  var uid = function () { return (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2)); };
  var fmt = function (ts) {
    var d = new Date(ts);
    var p = function (n) { return (n < 10 ? "0" : "") + n; };
    return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  };

  // ---- selected files (not yet saved) ----
  var pending = [];           // {id, file}
  var thumbsEl = document.getElementById("thumbs");
  function renderThumbs() {
    thumbsEl.innerHTML = "";
    pending.forEach(function (p, i) {
      var url = URL.createObjectURL(p.file);
      var d = document.createElement("div"); d.className = "t";
      var im = document.createElement("img"); im.src = url;
      var x = document.createElement("button"); x.textContent = "×"; x.title = "移除";
      x.onclick = function () { URL.revokeObjectURL(url); pending.splice(i, 1); renderThumbs(); };
      d.appendChild(im); d.appendChild(x); thumbsEl.appendChild(d);
    });
  }
  var fileInput = document.getElementById("file");
  function addFiles(files) {
    Array.prototype.forEach.call(files, function (f) {
      if (f && f.type && f.type.indexOf("image/") === 0) pending.push({ id: uid(), file: f });
    });
    renderThumbs();
  }
  fileInput.addEventListener("change", function () { addFiles(fileInput.files); fileInput.value = ""; });
  var zone = document.getElementById("filezone");
  ["dragover", "dragenter"].forEach(function (e) { zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.style.borderColor = "var(--brand)"; }); });
  ["dragleave", "drop"].forEach(function (e) { zone.addEventListener(e, function (ev) { ev.preventDefault(); zone.style.borderColor = ""; }); });
  zone.addEventListener("drop", function (ev) { addFiles(ev.dataTransfer.files); });

  // ---- toast ----
  var toastEl = document.getElementById("toast");
  function toast(msg) { toastEl.textContent = msg; toastEl.classList.add("show"); setTimeout(function () { toastEl.classList.remove("show"); }, 1800); }

  // ---- save ----
  document.getElementById("save").addEventListener("click", function () {
    var title = document.getElementById("title").value.trim();
    var content = document.getElementById("content").value.trim();
    if (!title && !content && pending.length === 0) { toast("写点东西再保存吧"); return; }
    var item = {
      id: uid(),
      title: title,
      content: content,
      createdAt: Date.now(),
      images: pending.map(function (p) { return { id: p.id, file: p.file, name: p.file.name, type: p.file.type }; })
    };
    put(item).then(function () {
      toast("已保存 ✅");
      document.getElementById("title").value = "";
      document.getElementById("content").value = "";
      pending.forEach(function (p) { /* revoke later on render */ });
      pending = []; renderThumbs();
      load();
    }).catch(function (e) { toast("保存失败：" + e); });
  });

  document.getElementById("clear").addEventListener("click", function () {
    document.getElementById("title").value = ""; document.getElementById("content").value = "";
    pending = []; renderThumbs();
  });

  // ---- render list ----
  var grid = document.getElementById("grid");
  var emptyEl = document.getElementById("empty");
  var countEl = document.getElementById("count");
  var searchEl = document.getElementById("search");
  var urlCache = {}; // id -> objectURL

  function buildCard(it) {
    var card = document.createElement("div"); card.className = "card";
    var h = document.createElement("h3"); h.textContent = it.title || "(无标题)";
    var meta = document.createElement("div"); meta.className = "meta"; meta.textContent = fmt(it.createdAt);
    var body = document.createElement("div"); body.className = "body"; body.textContent = it.content || "";
    card.appendChild(h); card.appendChild(meta); card.appendChild(body);

    if (it.images && it.images.length) {
      var ig = document.createElement("div"); ig.className = "imgs";
      it.images.forEach(function (im) {
        var url = urlCache[im.id] || (urlCache[im.id] = URL.createObjectURL(im.file));
        var img = document.createElement("img"); img.src = url; img.alt = im.name || "";
        img.onclick = function () { openLightbox(url); };
        ig.appendChild(img);
      });
      card.appendChild(ig);
    }

    var acts = document.createElement("div"); acts.className = "acts";
    var del = document.createElement("button"); del.className = "btn-danger"; del.textContent = "删除";
    del.onclick = function () {
      if (!confirm("删除这条灵感？")) return;
      (it.images || []).forEach(function (im) { if (urlCache[im.id]) { URL.revokeObjectURL(urlCache[im.id]); delete urlCache[im.id]; } });
      del_(it.id);
    };
    acts.appendChild(del); card.appendChild(acts);
    return card;
  }

  function load() {
    all().then(function (items) {
      items.sort(function (a, b) { return b.createdAt - a.createdAt; });
      var q = (searchEl.value || "").trim().toLowerCase();
      var list = q ? items.filter(function (it) {
        return (it.title || "").toLowerCase().indexOf(q) >= 0 || (it.content || "").toLowerCase().indexOf(q) >= 0;
      }) : items;
      grid.innerHTML = "";
      list.forEach(function (it) { grid.appendChild(buildCard(it)); });
      emptyEl.style.display = items.length ? "none" : "block";
      countEl.textContent = items.length ? (q ? "匹配 " + list.length + " / 共 " + items.length + " 条" : "共 " + items.length + " 条") : "";
    });
  }
  function del_(id) { del(id).then(load).catch(function (e) { toast("删除失败：" + e); }); }
  searchEl.addEventListener("input", load);

  // ---- lightbox ----
  var lb = document.getElementById("lightbox"), lbImg = document.getElementById("lightboxImg");
  function openLightbox(url) { lbImg.src = url; lb.classList.add("show"); }
  lb.addEventListener("click", function () { lb.classList.remove("show"); lbImg.src = ""; });

  // ---- export / import ----
  function blobToDataURL(blob) {
    return new Promise(function (res, rej) {
      var fr = new FileReader();
      fr.onload = function () { res(fr.result); };
      fr.onerror = function () { rej(fr.error); };
      fr.readAsDataURL(blob);
    });
  }
  function dataURLToBlob(u) {
    var arr = u.split(","), m = arr[0].match(/:(.*?);/), bstr = atob(arr[1]), n = bstr.length, u8 = new Uint8Array(n);
    while (n--) u8[n] = bstr.charCodeAt(n);
    return new Blob([u8], { type: m[1] });
  }
  document.getElementById("export").addEventListener("click", function () {
    all().then(function (items) {
      return Promise.all(items.map(function (it) {
        return Promise.all((it.images || []).map(function (im) {
          return blobToDataURL(im.file).then(function (d) { return { id: im.id, name: im.name, type: im.type, data: d }; });
        })).then(function (imgs) { return { id: it.id, title: it.title, content: it.content, createdAt: it.createdAt, images: imgs }; });
      }));
    }).then(function (data) {
      var blob = new Blob([JSON.stringify({ app: "inspiration-box", version: 1, items: data }, null, 2)], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "灵感盒子备份_" + new Date().toISOString().slice(0, 10) + ".json";
      a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      toast("已导出备份 ✅");
    });
  });
  var importFile = document.getElementById("importFile");
  document.getElementById("import").addEventListener("click", function () { importFile.click(); });
  importFile.addEventListener("change", function () {
    var f = importFile.files[0]; if (!f) return;
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var data = JSON.parse(rd.result);
        var items = (data.items || []).map(function (it) {
          return {
            id: it.id || uid(),
            title: it.title || "",
            content: it.content || "",
            createdAt: it.createdAt || Date.now(),
            images: (it.images || []).map(function (im) { return { id: im.id || uid(), file: dataURLToBlob(im.data), name: im.name, type: im.type }; })
          };
        });
        Promise.all(items.map(put)).then(function () { toast("导入完成 ✅"); importFile.value = ""; load(); }).catch(function (e) { toast("导入失败：" + e); });
      } catch (e) { toast("文件格式不对"); }
    };
    rd.readAsText(f);
  });

  // ---- init ----
  openDB().then(load).catch(function (e) { toast("数据库打开失败：" + e); });
})();
</script>
</body>
</html>
